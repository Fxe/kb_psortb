#
# define display information
#
name: Annotate Genome with PSORTb 3.0

tooltip: |
    Perform some kind of method

screenshots: []

icon: psortb.gif

#
# define a set of similar apps that might be useful to the user
#
suggestions:
    apps:
        related:
            [app1, app2]
        next:
            [app3, app4]

#
# Configure the display and description of parameters
#
parameters :
    input_genome :
        ui-name : |
            Genome
        short-hint : |
            Genome object to annotate

    org_type :
        ui-name : |
            Choose an organism type
        short-hint : |
            The first parameter
        long-hint  : |
            The first parameter that needs to be entered to drive the method. This might be the first of many.

description : |
    <p>PSORTb is maintained by the <a href="http://www.brinkman.mbb.sfu.ca/">Brinkman Laboratory</a>, Simon Fraser University, British Columbia, Canada. If you use PSORTb in your research, we would greatly appreciate if you cited one of the following publications, and note the version of software you use:</p>

    <p>PSORTb v3.0: N.Y. Yu, J.R. Wagner, M.R. Laird, G. Melli, S. Rey, R. Lo, P. Dao, S.C. Sahinalp, M. Ester, L.J. Foster, F.S.L. Brinkman (2010) PSORTb 3.0: Improved protein subcellular localization prediction with refined localization subcategories and predictive capabilities for all prokaryotes, Bioinformatics 26(13):1608-1615</p>

    <p>PSORTb v2.0: J.L. Gardy, M.R. Laird, F. Chen, S. Rey, C.J. Walsh, M. Ester, and F.S.L. Brinkman (2005) PSORTb v.2.0: expanded prediction of bacterial protein subcellular localization and insights gained from comparative proteome analysis, Bioinformatics 21(5):617-623</p>
    
    <p>PSORTb v1.0: Jennifer L. Gardy, Cory Spencer, Ke Wang, Martin Ester, Gabor E. Tusnady, Istvan Simon, Sujun Hua, Katalin deFays, Christophe Lambert, Kenta Nakai and Fiona S.L. Brinkman (2003) PSORT-B: improving protein subcellular localization prediction for Gram-negative bacteria, Nucleic Acids Research 31(13):3613-17</p>
